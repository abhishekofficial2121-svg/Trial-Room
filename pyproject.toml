[project]
name = "trialroom-api"
version = "0.1.0"
description = "Trial Room virtual try-on API (V1)"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.104.0,<0.116.0",
    "uvicorn[standard]>=0.24.0,<0.32.0",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "sqlalchemy>=2.0.23,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "redis>=5.0.0,<6.0.0",
    "celery>=5.3.0,<6.0.0",
    "boto3>=1.28.0,<2.0.0",
    "botocore>=1.31.0,<2.0.0",
    "python-multipart>=0.0.6,<0.0.10",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "python-dateutil>=2.8.2,<3.0.0",
    "Pillow>=10.0.0,<11.0.0",
    "opencv-python-headless>=4.8.0,<5.0.0",
    "numpy>=1.24.0,<2.0.0",
    "media-pipe>=0.10.0",  # placeholder; adjust after model selection
    "loguru>=0.7.0,<1.0.0",
    "pytest>=7.4.0,<8.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "httpx>=0.24.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps/api*", "packages*", "services*"]