[alembic]
# path to migration scripts
script_location = alembic

# database URL (overridden by environment at runtime)
sqlalchemy.url = postgresql+psycopg2://trialroom:changeme@localhost:5432/trialroom

# version location
version_locations = alembic/versions

# timezone to use when rendering the date within migration files
timezone = UTC

# max length of characters to apply to the version slug
truncate_slug_length = 40

# set to 'true' to run the environment during development
revision_environment = false

[post_write_hooks]
# hooks run after writing a new migration script
# post_write_hooks = console

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S